[project]
name = "ipl-auction"
version = "0.1.0"
description = "IPL Auction Price Analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "statsmodels",
    "scikit-learn",
    "xgboost",
    "rapidfuzz",
    "scipy",
    "joblib",
    "requests",
    "linearmodels",
    "pygam",
    "pyarrow>=23.0.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
ignore-words-list = "aer,ponting"
